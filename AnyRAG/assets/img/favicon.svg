<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- AnyRAG mark: "what reaches the reader".
       Left: the candidate pool (dots, dimming as they rank lower).
       Right: the evidence pack, a bracket the budget allows, holding the two chunks that reach the reader. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- candidate pool -->
  <circle cx="6.5" cy="8.5" r="1.9" fill="#4fd2c4"/>
  <circle cx="6.5" cy="13.5" r="1.9" fill="#4fd2c4"/>
  <circle cx="6.5" cy="18.5" r="1.9" fill="#91adff" opacity=".55"/>
  <circle cx="6.5" cy="23.5" r="1.9" fill="#91adff" opacity=".3"/>
  <!-- only the top-ranked candidates flow into the pack -->
  <path d="M9.4 9.4 L12.6 12.4 M9.4 13.5 L12.6 16.4" stroke="#4fd2c4" stroke-width="1.3" stroke-linecap="round" opacity=".6"/>
  <!-- the pack: a budget bracket -->
  <path d="M17 6.5 H14.5 V25.5 H17 M25 6.5 H27.5 V25.5 H25" fill="none" stroke="#91adff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- chunks that reach the reader -->
  <rect x="16.8" y="10" width="8.4" height="4.2" rx="1.2" fill="#4fd2c4"/>
  <rect x="16.8" y="16.2" width="8.4" height="4.2" rx="1.2" fill="#4fd2c4" opacity=".85"/>
</svg>
